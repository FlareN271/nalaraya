<title>Nalaraya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap">
<style>
/* Layout: a wooden plank header, then a living pixel room (or world map) beside a parchment "today" board; feature screens open as parchment pages below the header. Deliberately a single bright daytime look. */
:root{
  color-scheme:light;
  --bg:#fbf4e4; --bg-2:#f4e8cf; --card:#fffaf0; --card-2:#fdf3de;
  --line:#e8d7b4; --line-2:#d2b98a;
  --ink:#3a2a1e; --ink-2:#6b5442; --ink-3:#8f7862;
  --wood:#8a5a36; --wood-d:#5e3b22; --wood-l:#c98f5a;
  --teal:#2f8f83; --teal-d:#1f6b62; --teal-l:#dcf0eb;
  --sun:#f5b941; --sun-d:#b9831c; --sun-l:#fdf0cf;
  --berry:#c8493f; --berry-l:#f9e1dc;
  --leaf:#4f9a4a; --leaf-l:#e2f1dc;
  --sky:#5aa9d6; --sky-l:#e2f2fb;
  --violet:#7d6bc8; --violet-l:#ece8fa;
  --night:#1d2650;
  --pixel:'Pixelify Sans','Courier New',monospace;
  --body:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--pixel);font-weight:600;color:var(--ink);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.15} h2{font-size:1.35rem;line-height:1.2} h3{font-size:1.08rem;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header plank */
.top{background:var(--wood);border-bottom:4px solid var(--wood-d);color:#fff6e3}
.top .wrap{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff6e3;cursor:pointer;padding:0}
.logo b{font-family:var(--pixel);font-size:1.45rem;font-weight:600;letter-spacing:.04em}
.logo svg{width:30px;height:30px}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.nav button{white-space:nowrap;font-family:var(--pixel);font-size:.92rem;background:transparent;color:#f6e3c2;border:2px solid transparent;border-radius:4px;padding:4px 9px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--card);color:var(--ink);border-color:var(--wood-d)}
.nav .n{display:inline-block;margin-left:5px;background:var(--sun);color:var(--ink);border-radius:3px;padding:0 5px;font-size:.78rem}
.status{display:flex;gap:10px;align-items:center;font-size:.82rem;color:#f6e3c2;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;background:#b7a58c;display:inline-block}
.sync.ok i{background:#8fd16a} .sync.busy i{background:var(--sun)} .sync.warn i{background:#ff8a7a}
main{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
/* common */
.eyebrow{font-family:var(--pixel);font-size:.82rem;letter-spacing:.06em;color:var(--teal-d)}
.head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.head .sub{color:var(--ink-2);margin-top:4px;max-width:68ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--card);border:2px solid var(--line-2);border-radius:6px;box-shadow:0 4px 0 var(--line);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel.flat{box-shadow:none;background:var(--card-2)}
.panel.note{background:var(--sun-l);border-color:#ecc76e;box-shadow:0 4px 0 #f1dca0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--pixel);font-size:.98rem;border-radius:4px;border:2px solid var(--wood-d);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer;line-height:1.15;box-shadow:0 3px 0 var(--wood-d);transition:transform .05s}
.btn:hover{background:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal-d);box-shadow:0 3px 0 var(--teal-d)}
.btn.primary:hover{background:#34a194}
.btn.sun{background:var(--sun);border-color:var(--sun-d);box-shadow:0 3px 0 var(--sun-d)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line-2)}
.btn.ghost:active{transform:none}
.btn.danger{color:var(--berry)}
.btn.sm{padding:4px 10px;font-size:.86rem}
.btn:disabled{opacity:.55;cursor:default}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.86rem;color:var(--ink-2);min-width:0}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{background:#fff;border:2px solid var(--line-2);border-radius:4px;padding:7px 10px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:#b4a28a}
input[type=checkbox]{accent-color:var(--teal);width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:1px 8px;border-radius:3px;border:2px solid var(--line-2);color:var(--ink-2);white-space:nowrap;background:#fff}
.chip.teal{color:var(--teal-d);border-color:#9fd2c9;background:var(--teal-l)}
.chip.sun{color:#7a5310;border-color:#ecc76e;background:var(--sun-l)}
.chip.leaf{color:#2f6a2b;border-color:#a9d39f;background:var(--leaf-l)}
.chip.berry{color:#8f2e26;border-color:#eaa79f;background:var(--berry-l)}
.chip.violet{color:#4b3d8f;border-color:#c3b9ee;background:var(--violet-l)}
.num{font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--bg-2);border:2px solid var(--line-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.sun i{background:var(--sun)}
.empty{color:var(--ink-3);font-style:italic}
.stat b{display:block;font-family:var(--pixel);font-size:1.7rem;font-weight:600;line-height:1.1}
.stat span{font-size:.82rem;color:var(--ink-2)}
code{background:var(--bg-2);padding:0 4px;border-radius:3px;font-size:.9em}
/* aula */
.aula{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
.scene{position:relative;border:4px solid var(--wood-d);border-radius:6px;overflow:hidden;background:#f3e3c3;box-shadow:0 5px 0 var(--line-2)}
.scene canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.scene.map canvas{aspect-ratio:240/150}
.hs{position:absolute;background:transparent;border:2px dashed transparent;border-radius:3px;cursor:pointer;padding:0}
.hs:hover,.hs:focus-visible{border-color:rgba(255,255,255,.95);background:rgba(255,255,255,.12);outline:none}
.hs .tag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--pixel);font-size:.74rem;background:var(--card);color:var(--ink);border:2px solid var(--wood-d);border-radius:3px;padding:0 6px;box-shadow:0 2px 0 var(--wood-d);pointer-events:none}
.hs .tag.b{bottom:-4px} .hs .tag.t{top:-4px}
.hs .tag .n{background:var(--sun);border-radius:2px;padding:0 4px;margin-left:4px}
.hs.tour-on{border-color:var(--sun);border-style:solid;background:rgba(245,185,65,.18);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(245,185,65,.38)}}
.bubble{position:absolute;left:15.5%;top:1.5%;max-width:36%;background:#fff;border:2px solid var(--wood-d);border-radius:4px;box-shadow:0 3px 0 var(--wood-d);padding:8px 12px;font-size:.92rem;line-height:1.4;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.aula-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap}
.aula-head h1{font-size:1.6rem}
.stage{display:flex;justify-content:center}
.room{position:relative}
.scene.big{width:min(100%,max(640px,calc((100vh - 170px) * 1.7778)))}
.scene.big .hs .tag{font-size:.88rem;padding:1px 8px}
.below{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.tourcard.over{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:min(640px,92%);z-index:2}
.bubble:before{content:"";position:absolute;left:-8px;top:10px;border:6px solid transparent;border-right-color:var(--wood-d)}
.bubble b{font-family:var(--pixel);font-weight:600;color:var(--teal-d)}

.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.door{display:flex;align-items:center;gap:8px;text-align:left;background:var(--card);border:2px solid var(--line-2);border-radius:4px;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 var(--line);font-size:.88rem;line-height:1.25;min-width:0}
.door:hover{border-color:var(--wood)}
.door svg{width:26px;height:26px;flex:none}
.door b{display:block;font-family:var(--pixel);font-weight:600;font-size:.92rem}
.door span{color:var(--ink-3);font-size:.78rem}
.tour.tour-on{outline:3px solid var(--sun);outline-offset:3px}
#gerbang.tour-on{outline:3px solid var(--sun);outline-offset:3px;animation:pulse2 1.1s ease-in-out infinite}
@keyframes pulse2{50%{outline-color:#ffe08a}}
.tourcard{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid var(--sun-d);border-radius:6px;box-shadow:0 4px 0 #e2b65a;padding:14px 16px}
.tourcard svg{width:52px;height:52px;flex:none}
.gate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flame{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:2px solid var(--line-2);border-radius:4px;padding:10px;cursor:pointer;box-shadow:0 3px 0 var(--line);min-width:0}
.flame:hover{border-color:var(--wood)}
.flame[aria-pressed="true"]{border-color:var(--sun-d);background:var(--sun-l);box-shadow:0 3px 0 #e2b65a}
.flame strong{font-family:var(--pixel);font-weight:600;font-size:1rem}
.flame span{font-size:.8rem;color:var(--ink-2);line-height:1.3}
.flame .fl{display:flex;gap:2px;height:22px;align-items:flex-end}
.flame .fl svg{width:16px;height:20px}
.timer{font-family:var(--pixel);font-size:3.2rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.timer.over{color:var(--sun-d)}
.tl{position:relative;height:22px;border:2px solid var(--wood-d);border-radius:3px;overflow:hidden;background:#fff}
.tl i{position:absolute;top:0;bottom:0}
.tl .now{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--berry)}
.tl-ax{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-3);margin-top:2px}
.k-emas{background:var(--sun)}.k-baik{background:#7cc4e8}.k-ringan{background:#a9d39f}.k-dinas{background:#e3d6bd}.k-pulih{background:#e9c6e0}.k-tidur{background:#5a6290}.k-bebas{background:#f3e7cc}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.76rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
/* review */
.flash{background:#fff;border:3px solid var(--wood-d);border-radius:6px;box-shadow:0 5px 0 var(--wood-d);padding:26px 24px;min-height:230px;display:flex;flex-direction:column;gap:16px;background-image:linear-gradient(transparent 0 38px,#f1e3c6 38px 40px,transparent 40px);background-size:100% 40px;background-position:0 30px}
.flash .front{font-size:1.4rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600}
.flash .back{font-size:1.08rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;border-top:3px dashed var(--line-2);padding-top:14px;background:#fff}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:4px;border:2px solid var(--wood-d);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--wood-d);font-family:var(--pixel);font-size:1rem}
.rate button small{font-family:var(--body);color:var(--ink-2);font-size:.78rem}
.rate .r0{background:var(--berry-l)} .rate .r1{background:var(--sun-l)} .rate .r2{background:var(--teal-l)} .rate .r3{background:var(--leaf-l)}
.rate button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
kbd{font-family:var(--body);font-size:.72rem;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink-2);background:#fff}
/* shelf */
.shelf{display:flex;align-items:flex-end;gap:4px;padding:14px 12px 0;min-height:150px;background:#6b4329;border:4px solid var(--wood-d);border-bottom-width:12px;border-radius:4px;overflow-x:auto}
.book{position:relative;width:36px;flex:none;border-radius:2px 2px 0 0;cursor:pointer;border:2px solid rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:6px 0;overflow:hidden;color:#fff}
.book span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--pixel);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;position:relative;z-index:1;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.book .gild{position:absolute;left:0;right:0;bottom:0;background:rgba(245,185,65,.75)}
.book[aria-pressed="true"]{outline:3px solid var(--sun);outline-offset:2px}
.book.add{background:transparent;border:2px dashed #c99a62;color:#f6e3c2}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px}
.tabs button{white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--sun-l);border-color:var(--sun-d);box-shadow:0 3px 0 var(--sun-d)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-family:var(--pixel);font-weight:600;text-align:left;color:var(--ink-2);font-size:.82rem;padding:6px 8px;border-bottom:2px solid var(--line-2)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.clip{max-width:300px;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column}
.list > div{padding:10px 0;border-bottom:1px solid var(--line)}
.list > div:last-child{border-bottom:0}
/* quests */
.board{background:#d8a46a;border:4px solid var(--wood-d);border-radius:6px;padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.paper{position:relative;background:#fffaf0;border:2px solid #e2cfa8;border-radius:2px;padding:18px 16px 14px;box-shadow:0 4px 0 rgba(94,59,34,.35);display:flex;flex-direction:column;gap:6px}
.paper:before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;background:var(--berry);border:2px solid #8f2e26;border-radius:50%;transform:translateX(-50%)}
.paper:nth-child(2n){transform:rotate(.6deg)} .paper:nth-child(2n+1){transform:rotate(-.5deg)}
.misi{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.misi input{margin-top:3px;flex:none}
.misi.done label{color:var(--ink-3);text-decoration:line-through}
.misi .x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 4px;font-size:1.1rem}
/* sky */
.skybox{background:var(--night);border:4px solid #11173a;border-radius:6px;padding:12px;color:#e8ecff}
.skybox svg{width:100%;height:auto;display:block}
/* tempa */
.prop{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.prop textarea{min-height:58px;font-size:.92rem}
.prop.off textarea{opacity:.5}
.forge{display:flex;align-items:center;gap:10px;font-family:var(--pixel);color:var(--teal-d)}
.forge i{width:8px;height:8px;background:var(--sun);display:inline-block;animation:blink 1s steps(2) infinite}
.forge i:nth-child(2){animation-delay:.33s}.forge i:nth-child(3){animation-delay:.66s}
@keyframes blink{50%{opacity:.15}}
.pack{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.pack:last-child{border-bottom:0}
.pack .ico{width:40px;height:40px;flex:none;border:2px solid var(--wood-d);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:1.1rem;font-weight:600}
.slotbars{display:flex;flex-direction:column;gap:8px}
.slotbars .s{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:.88rem}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:st}
.step{background:#fff;border:2px solid var(--line-2);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:4px}
.step b{font-family:var(--pixel);font-weight:600}
.step .k{font-family:var(--pixel);color:var(--teal-d);font-size:.8rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff6e3;border:2px solid var(--wood-d);padding:9px 16px;border-radius:4px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:20;box-shadow:0 3px 0 var(--wood-d)}
.toast.show{opacity:1}
@media (max-width:1020px){.aula,.below{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g3{grid-template-columns:minmax(0,1fr)}.doors{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .g2,.gate{grid-template-columns:minmax(0,1fr)}
  .rate{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scene.big .hs .tag,.hs .tag{font-size:.62rem;padding:0 3px;border-width:1px;box-shadow:none}
  .tourcard.over{position:static;transform:none;width:auto;border-width:0;border-top:4px solid var(--wood-d);border-radius:0;box-shadow:none}
  .tourcard svg{width:40px;height:40px}
  .bubble{position:static;max-width:none;border-width:0;border-top:4px solid var(--wood-d);border-radius:0;box-shadow:none;width:100%}
  .bubble:before{display:none}
  h1{font-size:1.55rem}
  .slotbars .s{grid-template-columns:105px minmax(0,1fr) 54px}
  .prop{grid-template-columns:auto minmax(0,1fr)}
  .prop textarea:last-child{grid-column:2}
  .steps{grid-template-columns:minmax(0,1fr)}
  .timer{font-size:2.6rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <button class="logo" type="button" data-go="aula" aria-label="Nalaraya, kembali ke Aula">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="3" width="12" height="11" fill="#5e3b22"/><rect x="3" y="4" width="5" height="9" fill="#fffaf0"/><rect x="8" y="4" width="5" height="9" fill="#f4e8cf"/><rect x="7" y="4" width="2" height="9" fill="#c98f5a"/><rect x="12" y="1" width="2" height="2" fill="#f5b941"/><rect x="13" y="0" width="1" height="1" fill="#fff3c4"/><rect x="4" y="6" width="3" height="1" fill="#c9b18a"/><rect x="4" y="8" width="3" height="1" fill="#c9b18a"/><rect x="9" y="6" width="3" height="1" fill="#c9b18a"/></svg>
      <b>Nalaraya</b>
    </button>
    <nav class="nav" id="nav" aria-label="Ruangan"></nav>
    <div class="status"><span id="auth-slot"></span><span id="week-chip"></span><span id="sync" class="sync"><i></i><span>Membuka gerbang…</span></span></div>
  </div>
</header>

function schedule(c,r){
  var now=Date.now();

    if(r===1){c.interval=c.reps===0?1:Math.max(1,Math.round(c.interval*1.2));c.ease=Math.max(1.3,c.ease-0.15);}
    if(r===2){c.interval=c.reps===0?1:c.reps===1?3:Math.max(c.interval+1,Math.round(c.interval*c.ease));}
    if(r===3){c.interval=c.reps===0?3:Math.max(c.interval+2,Math.round(c.interval*c.ease*1.3));c.ease=c.ease+0.15;}
    c.reps+=1;c.due=startOfDay(now)+c.interval*DAY+4*HOUR;

function constellationSvg(){
  var raks=allRaks(),cards=cardList(),list=raks.filter(function(r){return r.status==='aktif'||cards.some(function(c){return c.rak===r.id;});});
  var n=list.length||1,cols=Math.min(4,n),rows=Math.ceil(n/cols),W=800,RH=180,H=rows*RH;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Konstelasi: setiap kartu adalah bintang; kartu yang sudah dikuasai menyala terang">';
  list.forEach(function(r,i){var cx=(i%cols+0.5)*W/cols,cy=Math.floor(i/cols)*RH+78,cs=cards.filter(function(c){return c.rak===r.id;}),col=r.jalur==='utama'?'#f5d27a':'#a9c0ef';
    var pts=cs.map(function(c){var a=hash01(c.id,7)*Math.PI*2,d=14+hash01(c.id,13)*Math.min(70,W/cols/2-20);return {x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d*0.62,st:stage(c),a:a};});
    var br=pts.filter(function(p){return p.st==='menyala';}).sort(function(a,b){return a.a-b.a;});
    if(br.length>1)s+='<polyline points="'+br.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ')+'" fill="none" stroke="'+col+'" stroke-opacity=".45" stroke-width="1.2"/>';
    pts.forEach(function(p){var rr=p.st==='menyala'?3.4:p.st==='belajar'?2.1:1.3,op=p.st==='menyala'?1:p.st==='belajar'?.75:.35;s+='<rect x="'+(p.x-rr).toFixed(1)+'" y="'+(p.y-rr).toFixed(1)+'" width="'+(rr*2).toFixed(1)+'" height="'+(rr*2).toFixed(1)+'" fill="'+col+'" fill-opacity="'+op+'"/>';});
    if(!cs.length)s+='<rect x="'+(cx-20)+'" y="'+(cy-14)+'" width="40" height="28" fill="none" stroke="#4b5689" stroke-dasharray="3 4"/>';
    s+='<text x="'+cx+'" y="'+(cy+80)+'" text-anchor="middle" fill="#e8ecff" font-size="15" font-family="Pixelify Sans, monospace">'+esc(r.nama.length>28?r.nama.slice(0,26)+'…':r.nama)+'</text>';
    s+='<text x="'+cx+'" y="'+(cy+98)+'" text-anchor="middle" fill="#9aa6d6" font-size="12" font-family="Nunito Sans, sans-serif">'+br.length+' menyala · '+cs.length+' kartu'+(r.status==='arsip'?' · lama':'')+'</text>';});
  return s+'</svg>';
}

function loginErr(e){
  var m=String((e&&e.message)||e||'');
  if(/Unexpected token|not valid JSON|Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Supabase tidak bisa dihubungi. Periksa supabaseUrl di CONFIG: harus berbentuk https://kodeproject.supabase.co (dari Settings > API Keys / Connect), bukan alamat dashboard. Pastikan juga project tidak sedang di-pause.';
  if(/Invalid login credentials/i.test(m)) return 'Email atau kata sandi salah.';
  if(/Email not confirmed/i.test(m)) return 'Akun ini belum dikonfirmasi. Di Supabase buka Authentication > Users, lalu konfirmasi pengguna ini.';
  if(/Invalid API key|apikey/i.test(m)) return 'Kunci di CONFIG tidak cocok. Salin ulang publishable key dari Settings > API Keys.';
  if(/rate limit/i.test(m)) return 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.';
  if(/Signups not allowed|not found|User not found/i.test(m)) return 'Email ini belum terdaftar di Authentication > Users.';
  return m||'Gagal masuk. Coba lagi.';

/* ---------- Meja Tempa: file reading + sampling ---------- */
var LIB={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',zip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'};
async function readFile(file){
  var name=file.name.toLowerCase(),buf;
  if(/\.(txt|md)$/.test(name)) return {text:await file.text(),info:'teks'};
  buf=await file.arrayBuffer();
  if(/\.pdf$/.test(name)||file.type==='application/pdf'){
    if(!window.pdfjsWorker)await loadScript(LIB.pdfw);if(!window.pdfjsLib)await loadScript(LIB.pdf);
    var doc=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise,out=[];
    for(var i=1;i<=doc.numPages;i++){var pg=await doc.getPage(i),tc=await pg.getTextContent();out.push('[Halaman '+i+'] '+tc.items.map(function(it){return it.str;}).join(' ').replace(/\s+/g,' '));}
    return {text:out.join('\n\n'),info:doc.numPages+' halaman'};
  }
  if(/\.(pptx|docx)$/.test(name)){
    if(!window.JSZip)await loadScript(LIB.zip);var zip=await window.JSZip.loadAsync(buf);
    if(/\.pptx$/.test(name)){
      var names=Object.keys(zip.files).filter(function(n){return /^ppt\/slides\/slide\d+\.xml$/.test(n);}).sort(function(a,b){return +a.match(/(\d+)\.xml$/)[1]- +b.match(/(\d+)\.xml$/)[1];}),sl=[];
      for(var j=0;j<names.length;j++){var xml=await zip.file(names[j]).async('string');sl.push('[Slide '+(j+1)+'] '+(xml.match(/<a:t[^>]*>[^<]*<\/a:t>/g)||[]).map(function(s){return decodeXml(s.replace(/<[^>]+>/g,''));}).join(' '));}
      return {text:sl.join('\n\n'),info:names.length+' slide'};
    }
    var dx=await zip.file('word/document.xml').async('string');
    var paras=dx.split('</w:p>').map(function(pp){return (pp.match(/<w:t[^>]*>[^<]*<\/w:t>/g)||[]).map(function(s){return decodeXml(s.replace(/<[^>]+>/g,''));}).join('');}).filter(function(x){return x.trim();});
    return {text:paras.join('\n'),info:paras.length+' paragraf'};
  }
  throw new Error('format');
}
async function onTempaFile(file){
  readTempaForm();S.tempa.sumber='Membaca '+file.name+'…';render();
  try{var r=await readFile(file);S.tempa.text=r.text.trim();S.tempa.sumber='Diambil dari '+file.name+' ('+r.info+'). Periksa teksnya, buang bagian yang tidak perlu, lalu tempa.';
    if(!S.tempa.text)S.tempa.sumber='File '+file.name+' tidak berisi teks yang bisa dibaca (mungkin hasil pindaian). Coba tempel teksnya dari NotebookLM.';}

/* ---------- backup / restore ---------- */
async function backup(){
  var data=JSON.stringify(Object.assign({nalaraya:2,dibuat:new Date().toISOString()},S.state),null,2),dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(dl){try{await dl.save({filename:'nalaraya-cadangan-'+dateKey(new Date())+'.json',data:data});toast('Cadangan disimpan.');return;}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Ada jendela simpan yang masih terbuka.');return;}}}
  if(!window.claude){try{var url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='nalaraya-cadangan-'+dateKey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},2000);toast('Cadangan diunduh.');return;}catch(e){}}
  var box=$('#restore-confirm');box.innerHTML='<p class="small muted">Unduhan tidak tersedia di tampilan ini. Salin teks berikut ke file .json:</p><textarea id="backup-text" readonly style="min-height:140px"></textarea>';$('#backup-text').value=data;$('#backup-text').select();
}
function onRestoreFile(file){
  var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!o.profile||!o.cards)throw 0;S.pendingRestore=o;
    $('#restore-confirm').innerHTML='<div class="panel note"><p class="small">File berisi '+Object.keys(o.cards).length+' kartu. Memulihkan akan mengganti isi Nalaraya saat ini.</p><div class="row"><button class="btn sm primary" data-act="restore-yes">Ganti dengan cadangan</button><button class="btn sm ghost" data-act="restore-no">Batal</button></div></div>';}
    catch(e){toast('File ini bukan cadangan Nalaraya.');}};rd.readAsText(file);
}
function doRestore(){
  var o=S.pendingRestore;if(!o)return;S.pendingRestore=null;var old=Object.keys(S.state.cards),oldLogs=Object.keys(S.state.logs);
  S.state=normalize({profile:o.profile,cards:o.cards,logs:o.logs||{}});
  if(Store.mode==='db'||Store.mode==='supa'){old.forEach(function(id){if(!S.state.cards[id])Store.card(id);});oldLogs.forEach(function(m){if(!S.state.logs[m])Store.log(m);});Object.keys(S.state.cards).forEach(function(id){Store.card(id);});Object.keys(S.state.logs).forEach(function(m){Store.log(m);});Store.profile();}
  else Store.saveLocal();
  render();toast('Cadangan dipulihkan.');
}

/* =========================================================
   Events
   ========================================================= */
var SAFE_WHILE_LOADING={'rak':1,'topik':1,'tip-next':1,'copy-nlm':1,'login-send':1,'login-pass':1};
document.addEventListener('click',function(ev){
  var hs=ev.target.closest('[data-hs]');
  if(hs){var v=hs.dataset.hs;if(v==='lilin'){var wk=weekInfo();toast('Lilin minggu ini: '+wk.count+' dari '+wk.target+' hari.');var g=$('#gerbang');if(g)g.scrollIntoView({block:'nearest'});return;}go(v);return;}
  var g2=ev.target.closest('[data-go]');if(g2){go(g2.dataset.go);return;}
  var a=ev.target.closest('[data-act]');if(!a)return;
  if(S.provisional&&!SAFE_WHILE_LOADING[a.dataset.act]){toast('Sebentar, data tersimpanmu sedang dimuat.');return;}
  act(a.dataset.act,a);
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.misi){if(S.provisional){el.checked=!el.checked;toast('Sebentar, data tersimpanmu sedang dimuat.');return;}var pr=el.dataset.misi.split('|'),m=findMisi(pr[0],pr[1]);if(m){m.selesai=el.checked;Store.profile();render();if(m.selesai)toast('Misi selesai. Petualangmu maju satu langkah di peta.');}return;}
  if(el.dataset&&el.dataset.tp!==undefined){var x=S.tempa.hasil&&S.tempa.hasil[+el.dataset.tp];if(x){x.on=el.checked;el.closest('.prop').classList.toggle('off',!el.checked);}return;}
  if(el.id==='baca-rak'){S.baca.rak=el.value;render();}
  if(el.id==='tempa-file'&&el.files&&el.files[0]){onTempaFile(el.files[0]);}
  if(el.id==='restore-file'&&el.files&&el.files[0]){onRestoreFile(el.files[0]);el.value='';}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='tempa-text'){S.tempa.text=ev.target.value;var l=$('#tempa-len');if(l)l.textContent=ev.target.value.length.toLocaleString('id-ID')+' karakter'+(ev.target.value.length>30000?' · hanya 30.000 karakter pertama yang ditempa.':'');}
});
document.addEventListener('keydown',function(ev){
  var tag=(ev.target.tagName||'').toLowerCase();
  if(ev.key==='Enter'&&tag==='input'){
    if(ev.target.id==='catatan-sesi'){ev.preventDefault();act('finish-save');return;}
    var m=ev.target.id.match(/^mi-(.+)-(\d+)$/);if(m){ev.preventDefault();act('misi-add',{dataset:{q:m[1],b:m[2]}});return;}
    if(ev.target.id==='quest-baru'){ev.preventDefault();act('quest-add');return;}
    if(ev.target.id==='login-pass'||ev.target.id==='login-email'){ev.preventDefault();loginPass();return;}
  }
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(S.view!=='baca'||!S.review)return;
  if((ev.key===' '||ev.key==='Enter')&&!S.review.shown){ev.preventDefault();act('reveal');}
  else if(S.review.shown&&/^[1-4]$/.test(ev.key)){ev.preventDefault();rate(+ev.key-1);}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(S.view==='aula'||S.view==='peta')){LOOP.frame++;(S.view==='aula'?drawRoom:drawMap)();}});

/* =========================================================
   Boot
   ========================================================= */
async function boot(){
  var h=(location.hash||'').slice(1);if(ALL_VIEWS.indexOf(h)>=0)S.view=h;
  try{var tm=localStorage.getItem('nalaraya.timer');if(tm)S.timer=JSON.parse(tm);}catch(e){}
  render();
  var sp=(async function(){try{return window.claude&&window.claude.use?await window.claude.use('sample'):null;}catch(e){return null;}})();
  await Store.connect();
  var loaded=null;try{loaded=await Store.load();}catch(e){toast('Data tersimpan belum bisa dibuka. Coba muat ulang.');}
  if(loaded&&loaded.profile){S.state=normalize(loaded);}
  S.provisional=false;
  if(!P().onboarded&&S.view==='aula')S.tour=0;
  render();
  if(!(loaded&&loaded.profile)){try{await Store.seedAll(S.state);}catch(e){Store.failed=true;setSync();}}
  if(Store.mode==='db'){var smp=await sp;S.ai=smp?{via:'claude',json:function(p,o){return smp.json(p,o);}}:null;}
  else if(Store.mode==='supa'){S.ai={via:'supabase',json:async function(p){
    var r=await SB.client.functions.invoke('tempa',{body:{prompt:p}});
    if(r.error){var msg='';try{var b=await r.error.context.json();msg=b&&b.error;}catch(e){}throw {code:'remote',message:msg||'Meja Tempa di Supabase belum siap. Periksa Edge Function "tempa" dan secrets-nya.'};}
    return r.data&&r.data.cards;}};}
  else S.ai=null;
  if(S.view==='tempa')render();
}
boot();
})();
</script>
